ownership: >-
  The card names organization "The Root Network", not "Futureverse". It is retained on the
  Futureverse profile because The Root Network is Futureverse's own layer-1 network and this same
  documentation host publishes the Futureverse Asset Register reference, whose production endpoint
  the docs name as https://ar-api.futureverse.app/graphql — a futureverse.com-family domain. The
  card is therefore recorded as a Futureverse-product surface under a product brand, and the brand
  distinction is stated here rather than hidden.

card:
