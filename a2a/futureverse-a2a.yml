grade: conformant
grade_basis: >-
  Graded against A2A 1.0.0 hard checks: capabilities is an OBJECT (pass), protocolVersion is present
  (pass), skills is an ARRAY (pass). preferredTransport, defaultInputModes and defaultOutputModes
  are all present, so no optional-field downgrade applies.
deviations:
  - id: protocol-version-behind
    severity: low
    detail: >-
      protocolVersion is "0.3", not "1.0.0". The document is structurally 1.0.0-clean but declares
      the pre-release protocol revision.
  - id: empty-skills
    severity: medium
    detail: >-
      skills is an empty array. The card asserts an agent surface exists but advertises no skill, so
      an A2A client can discover the agent and then find nothing it is able to invoke.
  - id: no-agent-endpoint
    severity: medium
    detail: >-
      url, provider.url, documentationUrl and the single supportedInterfaces entry all point at the
      documentation site root rather than at an A2A task endpoint. The reachable machine surface on
      this host is the MCP server at https://docs.therootnetwork.com/mcp (see mcp/), not an A2A one.
  - id: docs-scope-only
    severity: low
    detail: >-
      The card is generated by the documentation platform (Mintlify) and describes the docs corpus,
      not the Asset Register, FuturePass or RootRewards APIs. It is a documentation agent, not a
      product agent.

