apis:
- name: Futureverse Asset Register API
  description: >-
    Relay-compliant GraphQL API for the Asset Register — a metadata ledger that defines what an asset
    is, what it can do, and which environments it works in, across chains and for off-chain assets. 29
    queries cover assets, asset trees, collections, token schemas, namespaces, accounts, owners, transactions
    and webhook subscriptions; 28 mutations cover schema registration, asset linking, off-chain asset
    registration, profiles and webhook management. Introspection is open and anonymous; writes require
    a Sign-In-With-Ethereum bearer token or a wallet-signed ARTM transaction.
  humanURL: https://docs.therootnetwork.com/asset-register/introduction
  baseURL: https://ar-api.futureverse.app/graphql
