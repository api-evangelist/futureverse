x-base-url-reconciliation:
  tool: 0-working/repair-api-bases.py
  verdict: disagreement
  resolution: >-
    Not a defect. The four hosts belong to four different products and each was assigned from the
    provider's own documentation — ar-api.futureverse.app for the Asset Register (named in the
    Asset Register getting-started page), login.futureverse.app for FuturePass (the OIDC issuer in
    its own discovery document), root.rootnet.live/archive for the mainnet node (named on the
    connecting-to-The-Root-Network page), and docs.therootnetwork.com/mcp for the documentation MCP
    server (probed live). Nothing was picked for all of them. The RootRewards Quest API is left
    WITHOUT a baseURL because Futureverse does not publish one.
x-pointers-deliberately-absent:
  - type: Deprecation
    reason: >-
      No deprecation or sunset policy is published and no RFC 8594 headers are documented. The only
      deprecation evidence is after-the-fact runtime changelog notes. Emitting the pointer would
      assert a policy Futureverse does not have.
  - type: StatusPage
    reason: >-
      status.futureverse.com and status.therootnetwork.com do not resolve. futureverse.statuspage.io
      and therootnetwork.statuspage.io both return 200, but so does a nonsense control subdomain —
      every *.statuspage.io host redirects to Atlassian marketing. Recorded as a false positive in
      lifecycle/futureverse-lifecycle.yml.
  - type: Security
    reason: >-
      probe-security-programs.py found no security.txt, no bug bounty and no disclosure page on any
      host (vdp=none). /.well-known/security.txt is 404 or 403 everywhere.
  - type: Compliance
    reason: >-
      No trust center and no named certification (SOC 2, ISO 27001, PCI, HIPAA, FedRAMP) is
      published anywhere (trust=none).
  - type: Idempotency
    reason: >-
      No idempotency key on any surface. Per-address ARTM nonces prevent replay but do not make a
      client retry safe, and RootRewards point allocation has no duplicate protection at all. See
      conventions/futureverse-conventions.yml.
  - type: AsyncAPI
    reason: >-
      A real webhook surface exists and is catalogued, but no AsyncAPI document is published
      (/asyncapi.yaml and /asyncapi.json both 404). Only the Webhooks pointer is emitted.
  - type: GitHubOrganization
    reason: >-
      github.com/futureversecom, github.com/therootnetwork and github.com/futureverseai all return
      404. github.com/futureverse is a DIFFERENT entity — the R parallelization framework.
  - type: Blog
    reason: 'https://www.therootnetwork.com/blog returns 404; the Webflow site was removed.'
  - type: Pricing
    reason: >-
      No pricing page exists on any reachable surface. See plans/futureverse-plans-pricing.yml
      (plan_count 0).
