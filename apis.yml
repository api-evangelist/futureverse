- name: The Root Network Node RPC
  description: >-
    Public archive-node RPC for The Root Network mainnet, exposing both the Substrate JSON-RPC surface
    (author, babe, chain, state, system and custom nft/dex/fee-proxy methods over HTTP and WebSocket)
