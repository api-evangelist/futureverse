aid: futureverse
name: Futureverse
description: >-
  Futureverse is a New Zealand-founded "open metaverse" technology company that rolled up eleven
  startups after a US$54M raise in 2023 and built The Root Network (TRN), a Substrate-based
  layer-1 blockchain with an EVM layer, any-token gas, and native NFT/SFT, DEX and bridge protocols.
  Its developer surface is three products: the Asset Register, a Relay-compliant GraphQL API for
  cross-chain asset metadata, schemas and asset-to-asset links; FuturePass, an OpenID Connect
  identity and smart-wallet provider; and RootRewards, a points/quest REST API for partner
  applications. Futureverse Corporation was placed in receivership on 2025-09-30 and in liquidation
  on 2025-12-16. Its corporate website and its original developer documentation host are both
  offline, but the TRN documentation, the Asset Register GraphQL endpoint, the FuturePass OIDC
  provider, the mainnet RPC nodes and 35 npm packages remain live and publicly reachable.
