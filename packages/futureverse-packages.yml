source: >-
  npm registry metadata endpoints (registry.npmjs.org/<pkg>) queried directly for every package, on
  2026-08-16. Package existence cross-checked against the Futureverse SDK documentation at
  https://docs.therootnetwork.com/asset-register/getting-started and
  https://docs.therootnetwork.com/build/substrate/api-package.
first_party_basis: >-
  Both npm scopes are first-party. The @futureverse scope's registry maintainers are
  admin@futureverse.com, gareth.daines@futureverse.com and john@sylo.io (Sylo was one of the eleven
  companies Futureverse rolled up), and the Asset Register documentation links directly to
  npmjs.com/package/@futureverse/asset-register and @futureverse/asset-register-react as the
  official SDKs.

warning_do_not_confuse: >-
  github.com/futureverse is NOT this company — it is "futureverse", the R parallelization framework
  ("A Unifying Parallelization Framework in R for Everyone", futureverse.org). No Futureverse
  (metaverse) GitHub organization is reachable: github.com/futureversecom, github.com/therootnetwork
  and github.com/futureverseai all return HTTP 404. No source repository is linked from any npm
  package's metadata either — every package's `repository` field is empty.

currency_finding: >-
  The newest publish across all 35 packages is 2025-09-16, eleven months before this probe and two
  weeks before Futureverse was placed in receivership on 2025-09-30. Nothing has shipped since.
  Seven packages have not been published in over two years, and three still carry pre-release
  version strings (0.0.0-pre-SM-337.x) as their `latest` dist-tag.

