gaps:
- The three product APIs Futureverse actually ships — the Asset Register GraphQL API, the FuturePass OIDC
  provider, and the RootRewards Quest REST API — have NO MCP surface. An agent can read Futureverse's
  documentation through MCP but cannot act against any Futureverse system.
- No /.well-known/oauth-protected-resource or /.well-known/oauth-authorization-server is served on the
  MCP host (both 404), which is expected for an unauthenticated server.
