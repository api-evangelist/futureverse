note: >-
  Futureverse documents no rate limits and returns no rate-limit headers. There is no X-RateLimit-*,
  no RateLimit-* (IETF draft), no Retry-After and no documented 429 behaviour on any of its APIs. A
  client has no way to know its budget before it is throttled and no runtime signal when it is —
  which is the harder problem for an agent, because an agent cannot read a docs page mid-loop.

limits: []

what_is_published_instead:
  - surface: The Root Network Node RPC
    statement: >-
      "The Root Network RPC servers are not for sustained or business use, and they may become
      unavailable at anytime. You should run your node or use an RPC Service like Rootscan RPC for
      regular use."
    source: https://docs.therootnetwork.com/build/connecting-to-the-root-network
    reading: >-
      A prose disclaimer in place of a limit. It sets no number, so it cannot be respected
      programmatically — it can only be obeyed by not using the endpoint.
  - surface: Root Network runtime
    statement: >-
      Throughput is bounded at the protocol level instead: MAXIMUM_BLOCK_WEIGHT of 1s and
      BLOCK_GAS_LIMIT of 15,000,000 as of runtime v8.56.0.
    source: https://docs.therootnetwork.com/changelog
    reading: >-
      A consensus parameter, not an API quota. It constrains the chain, not a caller's key.

inverted_signal:
  finding: >-
    Futureverse CONSUMES the rate-limit signal it does not emit. Its webhook Subscription Service
    retries deliveries that fail with 429 and reads the subscriber's standard Retry-After header,
    taking the more conservative of that value and its own policy. The provider expects integrators
    to speak a runtime backpressure protocol that the provider's own APIs do not speak back.
  source: https://docs.therootnetwork.com/asset-register/guides/subscriptions

related_quotas:
  - name: webhook endpoint retries
    value: 20
    scope: per webhook endpoint
    detail: >-
      WebhookEndpoint.retries is configurable and capped at 20. The only published numeric limit
      anywhere in the Futureverse surface — and it governs Futureverse's own outbound behaviour, not
      an inbound caller.
    source: https://docs.therootnetwork.com/asset-register/guides/subscriptions
  - name: RootRewards payout page size
    value: 20
    scope: per GET /quests/{questId} request
    detail: Default `limit` on the payouts collection. A pagination default, not a rate limit.

