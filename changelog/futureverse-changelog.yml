  - version: v10.65.0
    date: '2025-02-04'
    breaking: false
    additions:
      - Partner Attribution pallet added.
      - Dependency update for a Grandpa fix.
  - version: v9.64.0
    date: '2025-01-17'
    breaking: false
    additions:
      - nft_collectionDetails RPC call added.
      - ERC-165 support on the ERC-20 and ERC-1155 EVM precompiles.
      - set_token_name extrinsic added to the SFT pallet.
