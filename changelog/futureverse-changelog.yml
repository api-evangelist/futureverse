  - version: v8.62.0
    date: '2024-11-07'
    breaking: false
    additions:
      - XRPL NFT bridging.
      - pallet-migration introduced for multi-block migrations.
      - Improved transact error handling.
  - version: v8.61.0
    date: '2024-10-17'
    breaking: false
    fixes:
      - Runtime migration fix deploying EIP-2470 and the Universal deployer via a runtime upgrade.
  - version: v8.59.0
    date: '2024-09-18'
    breaking: false
    additions:
      - SFT support in the marketplace precompile.
      - Per-asset payment delay in the XRPL bridge.
    fixes:
      - Simple offers can no longer be made on non-existent tokens.
  - version: v8.58.0
    date: '2024-09-04'
    breaking: false
    additions:
